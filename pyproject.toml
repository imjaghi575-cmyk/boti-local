[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "E701", "E702", "E402", "I001", "RUF001", "RUF005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
